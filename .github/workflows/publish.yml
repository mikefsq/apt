name: Publish archive

# Manual only. Packages are built by hand in their own repositories, so the
# archive is published by hand too — a schedule would only republish the same
# assets, and a notify step would have to live in a branch that is headed
# upstream as a pull request.
#
# Run it from the Actions tab, or: gh workflow run publish.yml --repo mikefsq/apt
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-archive
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg unzip jq

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::APT_GPG_PRIVATE_KEY is not set — apt rejects an unsigned archive"
            exit 1
          fi
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build archive
        env:
          # Lifts the GitHub API rate limit; the release assets themselves are public.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: ./bin/build-archive out

      - name: Verify the archive is signed
        run: |
          for suite in out/dists/*/; do
            test -f "$suite/InRelease" || { echo "::error::missing InRelease in $suite"; exit 1; }
          done

      # Done with git rather than a published action: the branch is a single
      # orphan commit force-pushed each run, which is a handful of commands, and
      # a pipeline holding a signing key is a poor place for extra dependencies.
      # Initialising a fresh repository inside out/ is what makes the commit an
      # orphan, so old .deb files never accumulate in history.
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm 'Publish archive'
          git push -qf \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
